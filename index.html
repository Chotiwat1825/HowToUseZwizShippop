<!DOCTYPE html>
<html lang="th" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="theme-color" id="meta-theme-color" content="#f8fafc" />
  <meta name="description" content="คู่มือแนวทางการใช้งานระบบ Zwiz และ Shippop สำหรับพนักงานขาย ร้านมรุกข" />
  <title>คู่มือพนักงานขาย Zwiz &amp; Shippop | ร้านมรุกข</title>

  <!-- Google Fonts: Prompt & Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&amp;family=Sarabun:wght@500;600;700;800&amp;display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'Sarabun', 'sans-serif'],
            body: ['Sarabun', 'Prompt', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Initial Theme Setup (Light Mode Baseline) -->
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('zwiz_manual_theme');
        const metaTheme = document.getElementById('meta-theme-color');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
          if (metaTheme) metaTheme.setAttribute('content', '#030712');
        } else {
          document.documentElement.classList.remove('dark');
          if (metaTheme) metaTheme.setAttribute('content', '#f8fafc');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    body {
      font-family: 'Prompt', 'Sarabun', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }
    /* Hide scrollbar for horizontal step strip on mobile */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes stepSlideNext {
      0% {
        opacity: 0.3;
        transform: translateX(14px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }
    @keyframes stepSlidePrev {
      0% {
        opacity: 0.3;
        transform: translateX(-14px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }
    @keyframes viewFadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-step-next {
      animation: stepSlideNext 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-step-prev {
      animation: stepSlidePrev 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-view-in {
      animation: viewFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-dvh flex flex-col transition-colors duration-200">

  <!-- =============================================================== -->
  <!-- MAIN SITE HEADER (Shown on Home Page; Hidden in Step Viewer!)   -->
  <!-- =============================================================== -->
  <header id="main-site-header" class="shrink-0 bg-white/95 backdrop-blur-md border-b-2 border-slate-200 shadow-sm dark:bg-slate-900/95 dark:border-slate-800 z-30">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
      <button
        id="btn-brand-home"
        type="button"
        class="flex items-center gap-3 text-left group focus:outline-none active:scale-95 transition-transform min-w-0"
      >
        <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-indigo-600 group-hover:bg-indigo-700 text-white flex items-center justify-center shadow-sm shrink-0">
          <svg class="w-6 h-6 sm:w-7 sm:h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <div class="truncate">
          <h1 class="text-lg sm:text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white truncate">
            คู่มือพนักงานขาย (ร้านมรุกข)
          </h1>
          <p class="text-xs sm:text-base font-semibold text-slate-600 dark:text-slate-300 truncate">
            ระบบส่งพัสดุ Zwiz &amp; Shippop
          </p>
        </div>
      </button>

      <button
        id="btn-theme-toggle-home"
        type="button"
        class="px-3.5 py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 border-2 border-slate-300 dark:border-slate-700 font-bold text-sm sm:text-base active:scale-95 transition inline-flex items-center gap-2 shrink-0"
      >
        <span class="theme-icon-box"></span>
        <span class="theme-label-text hidden sm:inline">โหมดสี</span>
      </button>
    </div>
  </header>

  <!-- =============================================================== -->
  <!-- 1. HOME VIEW: BIG SIMPLE TOPIC LIST                             -->
  <!-- =============================================================== -->
  <main id="home-view" class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-5 sm:py-7 space-y-4 animate-view-in">
    <!-- Populated by app.js -->
  </main>

  <!-- =============================================================== -->
  <!-- DESKTOP FLOATING SIDE PREV / NEXT BUTTONS (Outside #step-viewer)-->
  <!-- =============================================================== -->
  <button
    type="button"
    id="btn-prev-step-desktop"
    class="hidden fixed left-2 top-1/2 -translate-y-1/2 z-40 w-20 xl:w-28 min-h-[130px] xl:min-h-[160px] rounded-2xl border-2 transition-all active:scale-95 flex-col items-center justify-center gap-1.5 p-2 text-center select-none"
  >
  </button>

  <button
    type="button"
    id="btn-next-step-desktop"
    class="hidden fixed right-2 top-1/2 -translate-y-1/2 z-40 w-20 xl:w-28 min-h-[130px] xl:min-h-[160px] rounded-2xl transition-all active:scale-95 flex-col items-center justify-center gap-1.5 p-2 text-center select-none"
  >
  </button>

  <!-- =============================================================== -->
  <!-- 2. STEP VIEWER: 100% FULL SCREEN WIDTH & MAXIMIZED IMAGE        -->
  <!-- =============================================================== -->
  <main id="step-viewer" class="hidden flex-1 flex flex-col w-full h-dvh p-1 sm:p-2 lg:px-24 xl:px-32 overflow-hidden bg-slate-900 dark:bg-slate-950">
    
    <!-- Single Compact Top Bar (Merges Back Button + Step Info + Copy Command) -->
    <div id="step-instruction-box" class="shrink-0 bg-white dark:bg-slate-900 border-2 border-slate-300 dark:border-slate-800 rounded-xl sm:rounded-2xl px-2.5 py-2 sm:px-4 sm:py-2.5 shadow-md mb-1.5 flex flex-col gap-1">
      
      <div class="flex items-center justify-between gap-2">
        <!-- Back to Topic List Button -->
        <button
          id="btn-header-back-home"
          type="button"
          class="px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl bg-slate-900 hover:bg-slate-800 dark:bg-white dark:hover:bg-slate-200 text-white dark:text-slate-900 text-xs sm:text-base font-extrabold shadow active:scale-95 transition inline-flex items-center gap-1.5 shrink-0"
        >
          <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          <span>เลือกหัวข้ออื่น</span>
        </button>

        <!-- Step Counter + Step Title -->
        <div class="flex items-center gap-2 min-w-0 flex-1 justify-center sm:justify-start">
          <span id="step-badge-counter" class="px-2.5 py-1 rounded-lg bg-indigo-600 text-white text-xs sm:text-base font-extrabold shrink-0">
            1/11
          </span>
          <h2 id="step-title-text" class="text-sm sm:text-xl font-extrabold text-slate-900 dark:text-white truncate">
            ขั้นตอนที่ 1
          </h2>
        </div>

        <!-- Right Quick Actions: Copy #รับยอด (if applicable) + Theme -->
        <div class="flex items-center gap-1.5 shrink-0">
          <button
            id="btn-step-copy-cmd"
            type="button"
            class="hidden px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-extrabold shadow active:scale-95 transition items-center gap-1 shrink-0"
          >
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span id="btn-step-copy-label">คัดลอก #รับยอด 100</span>
          </button>

          <button
            id="btn-theme-toggle-viewer"
            type="button"
            class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 active:scale-95 transition"
            title="สลับสีพื้นหลัง"
          >
            <span class="theme-icon-box"></span>
          </button>
        </div>
      </div>

      <!-- Concise Instruction Line -->
      <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-0.5 px-1">
        <p id="step-desc-text" class="text-xs sm:text-lg font-bold text-slate-800 dark:text-slate-100 leading-snug">
          รายละเอียดขั้นตอน
        </p>
        <p id="step-tip-text" class="text-xs sm:text-sm font-bold text-rose-600 dark:text-rose-400">
          จุดสังเกต
        </p>
      </div>

    </div>

    <!-- ============================================================= -->
    <!-- MASSIVE IMAGE VIEWPORT (#step-image-viewport)                 -->
    <!-- Takes 100% width and ~86% height of the screen!               -->
    <!-- ============================================================= -->
    <div
      id="step-image-viewport"
      class="flex-1 min-w-0 min-h-0 w-full relative bg-slate-950 border-2 border-slate-700/80 rounded-xl sm:rounded-2xl flex items-center justify-center overflow-hidden select-none touch-none cursor-zoom-in"
    >
      <div
        id="step-zoom-layer"
        class="w-full h-full flex items-center justify-center origin-center will-change-transform"
      >
        <img
          id="step-main-image"
          src=""
          alt=""
          draggable="false"
          class="w-full h-full object-contain select-none pointer-events-none"
        />
      </div>

      <!-- Floating Easy Zoom Bar (1x, 2x, 3x + +/-) for Mobile, Tablet & Desktop -->
      <div class="absolute bottom-2 right-2 z-20 flex items-center gap-1 bg-slate-900/90 backdrop-blur-sm text-white px-2 py-1.5 rounded-xl shadow-xl border border-slate-700">
        <span class="hidden sm:inline text-xs font-bold text-slate-300 mr-1">
          ขยายภาพ:
        </span>
        <button
          type="button"
          id="btn-zoom-1x"
          class="px-2.5 py-1 rounded-lg bg-indigo-600 text-white text-xs sm:text-sm font-extrabold active:scale-95 transition"
        >
          1x เต็มจอ
        </button>
        <button
          type="button"
          id="btn-zoom-2x"
          class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xs sm:text-sm font-extrabold active:scale-95 transition"
        >
          ซูม 2x
        </button>
        <button
          type="button"
          id="btn-zoom-3x"
          class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xs sm:text-sm font-extrabold active:scale-95 transition"
        >
          ซูม 3x
        </button>
        <button
          type="button"
          id="btn-zoom-out"
          class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-extrabold text-base flex items-center justify-center active:scale-90 transition"
          title="ซูมออก"
        >
          −
        </button>
        <button
          type="button"
          id="btn-zoom-in"
          class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-extrabold text-base flex items-center justify-center active:scale-90 transition"
          title="ซูมเข้า"
        >
          +
        </button>
      </div>

      <!-- Helper Hint Pill when Zoomed In -->
      <div
        id="zoom-pan-hint"
        class="hidden absolute top-2 left-1/2 -translate-x-1/2 z-20 px-3.5 py-1 rounded-full bg-amber-500 text-slate-950 text-xs sm:text-sm font-extrabold shadow-lg pointer-events-none whitespace-nowrap"
      >
        ใช้นิ้วหรือเมาส์ลากเพื่อเลื่อนดูจุดต่างๆ (กด 1x เพื่อย่อกลับ)
      </div>
    </div>

    <!-- ============================================================= -->
    <!-- BOTTOM CONTROL BAR: MOBILE/TABLET PREV-NEXT + 1..11 NUMBERS   -->
    <!-- ============================================================= -->
    <div class="shrink-0 mt-1.5 bg-white dark:bg-slate-900 border-2 border-slate-300 dark:border-slate-800 rounded-xl sm:rounded-2xl px-2 py-1.5 sm:px-4 sm:py-2 shadow-md flex items-center justify-between gap-2">
      
      <!-- Mobile/Tablet Previous Button (Visible on < 1024px so side buttons never cover the image!) -->
      <button
        type="button"
        id="btn-prev-step-mobile"
        class="lg:hidden h-11 sm:h-12 px-3 sm:px-5 rounded-xl text-sm sm:text-lg font-extrabold border-2 transition active:scale-95 flex items-center justify-center gap-1.5 shrink-0"
      >
      </button>

      <!-- Single-Line Scrollable Step Numbers (1 2 3 ... 11) -->
      <div class="flex-1 min-w-0 flex items-center justify-start sm:justify-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
        <span class="hidden md:inline text-xs sm:text-sm font-extrabold text-slate-700 dark:text-slate-300 shrink-0 mr-1">
          เลือกภาพ:
        </span>
        <div id="step-number-pills" class="flex items-center gap-1.5 shrink-0">
          <!-- Populated dynamically -->
        </div>
      </div>

      <!-- Mobile/Tablet Next Button (Visible on < 1024px) -->
      <button
        type="button"
        id="btn-next-step-mobile"
        class="lg:hidden h-11 sm:h-12 px-3.5 sm:px-5 rounded-xl text-sm sm:text-lg font-extrabold transition active:scale-95 flex items-center justify-center gap-1.5 shrink-0"
      >
      </button>

    </div>

  </main>

  <!-- ================================================================= -->
  <!-- BIG READABLE TOAST NOTIFICATION                                   -->
  <!-- ================================================================= -->
  <div
    id="toast-container"
    class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[110] shadow-2xl rounded-2xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 border-2 border-slate-700 dark:border-slate-300 px-6 py-4 flex items-center gap-3 w-[90%] max-w-md transition-all duration-200"
    role="status"
    aria-live="polite"
  >
    <svg class="w-7 h-7 text-emerald-400 dark:text-emerald-600 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
    <span id="toast-message" class="text-base sm:text-lg font-extrabold leading-snug">ดำเนินการเรียบร้อย</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
