<!DOCTYPE html>
<html lang="th" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="theme-color" id="meta-theme-color" content="#f8fafc" />
  <meta name="description" content="คู่มือแนวทางการใช้งานระบบ Zwiz และ Shippop สำหรับพนักงานขาย ร้านมรุกข" />
  <title>คู่มือพนักงานขาย Zwiz &amp; Shippop | ร้านมรุกข</title>

  <!-- Google Fonts: Prompt & Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&amp;family=Sarabun:wght@500;600;700;800&amp;display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'Sarabun', 'sans-serif'],
            body: ['Sarabun', 'Prompt', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Initial Theme Setup (Light Mode Baseline) -->
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('zwiz_manual_theme');
        const metaTheme = document.getElementById('meta-theme-color');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
          if (metaTheme) metaTheme.setAttribute('content', '#030712');
        } else {
          document.documentElement.classList.remove('dark');
          if (metaTheme) metaTheme.setAttribute('content', '#f8fafc');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    body {
      font-family: 'Prompt', 'Sarabun', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes stepSlideNext {
      0% {
        opacity: 0.25;
        transform: translateX(18px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }
    @keyframes stepSlidePrev {
      0% {
        opacity: 0.25;
        transform: translateX(-18px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }
    @keyframes viewFadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-step-next {
      animation: stepSlideNext 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-step-prev {
      animation: stepSlidePrev 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-view-in {
      animation: viewFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-dvh flex flex-col transition-colors duration-200">

  <!-- =============================================================== -->
  <!-- TOP HEADER BAR                                                  -->
  <!-- =============================================================== -->
  <header class="shrink-0 bg-white/95 backdrop-blur-md border-b-2 border-slate-200 shadow-sm dark:bg-slate-900/95 dark:border-slate-800 z-30">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex items-center justify-between gap-2">
      
      <!-- Left: Brand / Home Button -->
      <button
        id="btn-brand-home"
        type="button"
        class="flex items-center gap-2.5 text-left group focus:outline-none active:scale-95 transition-transform min-w-0"
      >
        <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-indigo-600 group-hover:bg-indigo-700 text-white flex items-center justify-center shadow-sm shrink-0">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <div class="truncate">
          <h1 id="header-main-title" class="text-base sm:text-xl font-extrabold tracking-tight text-slate-900 dark:text-white truncate">
            คู่มือพนักงานขาย (ร้านมรุกข)
          </h1>
          <p id="header-sub-title" class="text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-300 truncate">
            ระบบส่งพัสดุ Zwiz &amp; Shippop
          </p>
        </div>
      </button>

      <!-- Right: Back to Home Button & Theme Toggle -->
      <div class="flex items-center gap-2 shrink-0">
        <button
          id="btn-header-back-home"
          type="button"
          class="hidden px-3.5 sm:px-5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 dark:bg-white dark:hover:bg-slate-200 text-white dark:text-slate-900 text-sm sm:text-lg font-extrabold shadow-sm active:scale-95 transition inline-flex items-center gap-2"
        >
          <svg class="w-5 h-5 sm:w-6 sm:h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          <span>เลือกหัวข้ออื่น</span>
        </button>

        <button
          id="btn-theme-toggle"
          type="button"
          class="px-3 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 border-2 border-slate-300 dark:border-slate-700 font-bold text-sm sm:text-base active:scale-95 transition inline-flex items-center gap-1.5"
          aria-label="สลับสีพื้นหลัง"
        >
          <span id="theme-icon-box"></span>
          <span id="theme-label-text" class="hidden md:inline">โหมดสี</span>
        </button>
      </div>

    </div>
  </header>

  <!-- =============================================================== -->
  <!-- 1. HOME VIEW: BIG SIMPLE TOPIC LIST                             -->
  <!-- =============================================================== -->
  <main id="home-view" class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-5 sm:py-7 space-y-4 animate-view-in">
    <!-- Populated by app.js -->
  </main>

  <!-- =============================================================== -->
  <!-- 2. STEP VIEWER: LEFT/RIGHT GIANT BUTTONS + MOUSE WHEEL ZOOM     -->
  <!-- =============================================================== -->
  <main id="step-viewer" class="hidden flex-1 flex flex-col max-w-7xl w-full mx-auto px-2 sm:px-5 py-2 sm:py-3 overflow-hidden">
    
    <!-- Top Instruction Banner -->
    <div id="step-instruction-box" class="shrink-0 bg-white dark:bg-slate-900 border-2 border-slate-300 dark:border-slate-800 rounded-2xl px-4 py-2.5 sm:px-5 sm:py-3 shadow-sm mb-2">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0 flex-1">
          <span id="step-badge-counter" class="px-3.5 py-1 rounded-xl bg-indigo-600 text-white text-sm sm:text-lg font-extrabold shrink-0">
            ภาพที่ 1 / 11
          </span>
          <h2 id="step-title-text" class="text-lg sm:text-2xl font-extrabold text-slate-900 dark:text-white truncate">
            ขั้นตอนที่ 1
          </h2>
        </div>

        <!-- Optional Copy Command Button (Shown on Cancel Order Step 8) -->
        <button
          id="btn-step-copy-cmd"
          type="button"
          class="hidden px-4 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm sm:text-base font-extrabold shadow active:scale-95 transition items-center gap-1.5 shrink-0"
        >
          <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span id="btn-step-copy-label">คัดลอก #รับยอด 100</span>
        </button>
      </div>

      <p id="step-desc-text" class="mt-1 text-base sm:text-xl font-bold text-slate-800 dark:text-slate-100 leading-snug">
        รายละเอียดขั้นตอน
      </p>
      <p id="step-tip-text" class="mt-0.5 text-sm sm:text-base font-bold text-rose-600 dark:text-rose-400">
        จุดสังเกต
      </p>
    </div>

    <!-- ============================================================= -->
    <!-- MIDDLE ROW: [GIANT PREV BTN] + [ZOOMABLE IMAGE] + [GIANT NEXT]-->
    <!-- ============================================================= -->
    <div class="flex-1 min-h-0 flex items-stretch gap-2 sm:gap-3">
      
      <!-- LEFT SIDE: GIANT PREVIOUS BUTTON -->
      <button
        type="button"
        id="btn-prev-step"
        class="w-20 sm:w-32 md:w-40 shrink-0 rounded-2xl border-2 transition-all active:scale-95 flex flex-col items-center justify-center gap-2 p-2 text-center select-none"
      >
        <!-- Populated dynamically -->
      </button>

      <!-- CENTER: INTERACTIVE MOUSE-ZOOMABLE IMAGE VIEWPORT -->
      <div
        id="step-image-viewport"
        class="flex-1 min-w-0 min-h-0 relative bg-slate-200/90 dark:bg-slate-900 border-2 border-slate-300 dark:border-slate-800 rounded-2xl flex items-center justify-center p-1.5 sm:p-2 overflow-hidden select-none cursor-zoom-in"
      >
        <div
          id="step-zoom-layer"
          class="w-full h-full flex items-center justify-center transition-transform duration-75 ease-out origin-center"
        >
          <img
            id="step-main-image"
            src=""
            alt=""
            draggable="false"
            class="max-h-full max-w-full w-auto h-auto object-contain rounded-xl bg-white shadow-sm select-none pointer-events-none"
          />
        </div>

        <!-- Floating Zoom Controls Bar (Bottom Right inside Image) -->
        <div class="absolute bottom-2.5 right-2.5 z-10 flex items-center gap-1.5 bg-slate-900/90 text-white px-2.5 py-1.5 rounded-xl shadow-lg border border-slate-700">
          <span class="hidden lg:inline text-xs font-bold text-slate-300 mr-1">
            หมุนลูกกลิ้งเมาส์เพื่อซูม:
          </span>
          <button
            type="button"
            id="btn-zoom-out"
            class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-extrabold text-lg flex items-center justify-center active:scale-90 transition"
            title="ซูมออก"
          >
            −
          </button>
          <button
            type="button"
            id="btn-zoom-reset"
            class="px-2.5 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs sm:text-sm font-extrabold text-amber-300 flex items-center justify-center active:scale-95 transition"
            title="คลิกเพื่อรีเซ็ตขนาดภาพ 100%"
          >
            100%
          </button>
          <button
            type="button"
            id="btn-zoom-in"
            class="w-8 h-8 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-lg flex items-center justify-center active:scale-90 transition"
            title="ซูมเข้า"
          >
            +
          </button>
        </div>
      </div>

      <!-- RIGHT SIDE: GIANT NEXT / FINISH BUTTON -->
      <button
        type="button"
        id="btn-next-step"
        class="w-20 sm:w-32 md:w-40 shrink-0 rounded-2xl transition-all active:scale-95 flex flex-col items-center justify-center gap-2 p-2 text-center select-none"
      >
        <!-- Populated dynamically -->
      </button>

    </div>

    <!-- ============================================================= -->
    <!-- BOTTOM BAR: DIRECT STEP NUMBER BUTTONS (1 2 3 ... 11)         -->
    <!-- ============================================================= -->
    <div class="shrink-0 mt-2 bg-white dark:bg-slate-900 border-2 border-slate-300 dark:border-slate-800 rounded-2xl px-3 py-2 sm:py-2.5 shadow-sm flex flex-wrap items-center justify-center gap-1.5 sm:gap-2">
      <span class="text-xs sm:text-base font-extrabold text-slate-700 dark:text-slate-300 mr-1">
        กดเลือกหมายเลขภาพโดยตรง:
      </span>
      <div id="step-number-pills" class="flex items-center gap-1.5 sm:gap-2 flex-wrap justify-center">
        <!-- Populated dynamically -->
      </div>
    </div>

  </main>

  <!-- ================================================================= -->
  <!-- BIG READABLE TOAST NOTIFICATION                                   -->
  <!-- ================================================================= -->
  <div
    id="toast-container"
    class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[110] shadow-2xl rounded-2xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 border-2 border-slate-700 dark:border-slate-300 px-6 py-4 flex items-center gap-3 w-[90%] max-w-md transition-all duration-200"
    role="status"
    aria-live="polite"
  >
    <svg class="w-7 h-7 text-emerald-400 dark:text-emerald-600 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
    <span id="toast-message" class="text-base sm:text-lg font-extrabold leading-snug">ดำเนินการเรียบร้อย</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
