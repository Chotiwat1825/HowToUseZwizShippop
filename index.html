<!DOCTYPE html>
<html lang="th" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="theme-color" id="meta-theme-color" content="#f8fafc" />
  <meta name="description" content="คู่มือแนวทางการใช้งานระบบ Zwiz และ Shippop สำหรับพนักงานขาย ร้านมรุกข" />
  <title>คู่มือพนักงานขาย Zwiz &amp; Shippop | ร้านมรุกข</title>

  <!-- Google Fonts: Prompt & Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&amp;family=Sarabun:wght@500;600;700;800&amp;display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'Sarabun', 'sans-serif'],
            body: ['Sarabun', 'Prompt', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Initial Theme Setup (Light Mode Baseline) -->
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('zwiz_manual_theme');
        const metaTheme = document.getElementById('meta-theme-color');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
          if (metaTheme) metaTheme.setAttribute('content', '#030712');
        } else {
          document.documentElement.classList.remove('dark');
          if (metaTheme) metaTheme.setAttribute('content', '#f8fafc');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    body {
      font-family: 'Prompt', 'Sarabun', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes modalZoomIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    .animate-modal-in {
      animation: modalZoomIn 0.18s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- Sticky Top Bar: Simple, Big, Uncluttered -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b-2 border-slate-200 shadow-sm dark:bg-slate-900/95 dark:border-slate-800">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-3">
      
      <!-- Left: Home / Brand Button -->
      <button
        id="btn-brand-home"
        type="button"
        class="flex items-center gap-3 text-left group focus:outline-none active:scale-95 transition-transform"
      >
        <div class="w-12 h-12 rounded-2xl bg-indigo-600 group-hover:bg-indigo-700 text-white flex items-center justify-center shadow-md shrink-0">
          <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-lg sm:text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white leading-tight">
            คู่มือพนักงานขาย (ร้านมรุกข)
          </h1>
          <p class="text-sm sm:text-base font-semibold text-slate-600 dark:text-slate-300">
            ระบบส่งพัสดุ Zwiz &amp; Shippop
          </p>
        </div>
      </button>

      <!-- Right: Back to Home Button (When viewing a topic) & Theme Toggle -->
      <div class="flex items-center gap-2.5 shrink-0">
        <button
          id="btn-header-back-home"
          type="button"
          class="hidden px-4 sm:px-5 py-3 rounded-2xl bg-slate-900 hover:bg-slate-800 dark:bg-white dark:hover:bg-slate-200 text-white dark:text-slate-900 text-base sm:text-lg font-extrabold shadow-md active:scale-95 transition inline-flex items-center gap-2"
        >
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          <span>กลับหน้าแรก</span>
        </button>

        <button
          id="btn-theme-toggle"
          type="button"
          class="px-3.5 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 border-2 border-slate-300 dark:border-slate-700 font-bold text-sm sm:text-base active:scale-95 transition inline-flex items-center gap-2"
          aria-label="สลับสีพื้นหลัง"
        >
          <span id="theme-icon-box"></span>
          <span id="theme-label-text" class="hidden sm:inline">โหมดสี</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">

    <!-- =============================================================== -->
    <!-- 1. HOME VIEW: BIG SIMPLE TOPIC LIST                             -->
    <!-- =============================================================== -->
    <section id="home-view" class="space-y-5">
      <!-- Populated by app.js -->
    </section>

    <!-- =============================================================== -->
    <!-- 2. STEP VIEWER: OPENS DIRECTLY AT IMAGE 1 OF X                  -->
    <!-- =============================================================== -->
    <section id="step-viewer" class="hidden space-y-5">
      <!-- Populated by app.js -->
    </section>

  </main>

  <!-- ================================================================= -->
  <!-- FULL-SCREEN IMAGE ZOOM MODAL (When tapping the image to enlarge)  -->
  <!-- ================================================================= -->
  <div
    id="lightbox-backdrop"
    class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-2 sm:p-6"
    role="dialog"
    aria-modal="true"
  >
    <div
      id="lightbox-container"
      class="bg-white dark:bg-slate-900 rounded-3xl w-full max-w-6xl shadow-2xl overflow-hidden border-2 border-slate-200 dark:border-slate-700 animate-modal-in flex flex-col max-h-[95vh]"
    >
      <!-- Top Bar -->
      <div class="px-5 sm:px-6 py-4 border-b-2 border-slate-200 dark:border-slate-800 flex items-center justify-between gap-4 bg-slate-50 dark:bg-slate-900">
        <h3 id="lightbox-title" class="text-lg sm:text-2xl font-extrabold text-slate-900 dark:text-white truncate">
          ภาพขยาย
        </h3>
        <button
          id="btn-close-lightbox"
          type="button"
          class="px-4 py-2.5 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white text-base sm:text-lg font-extrabold active:scale-95 transition inline-flex items-center gap-2 shrink-0"
        >
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
          <span>ปิดภาพขยาย</span>
        </button>
      </div>

      <!-- Large Image Body -->
      <div class="p-3 sm:p-6 bg-slate-950 flex-1 overflow-auto flex items-center justify-center">
        <img
          id="lightbox-image"
          src=""
          alt=""
          class="w-full max-h-[78vh] object-contain select-none"
        />
      </div>
    </div>
  </div>

  <!-- ================================================================= -->
  <!-- BIG READABLE TOAST NOTIFICATION                                   -->
  <!-- ================================================================= -->
  <div
    id="toast-container"
    class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[110] shadow-2xl rounded-2xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 border-2 border-slate-700 dark:border-slate-300 px-6 py-4 flex items-center gap-3 w-[90%] max-w-md transition-all duration-200"
    role="status"
    aria-live="polite"
  >
    <svg class="w-7 h-7 text-emerald-400 dark:text-emerald-600 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
    <span id="toast-message" class="text-base sm:text-lg font-extrabold leading-snug">ดำเนินการเรียบร้อย</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
